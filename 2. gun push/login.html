            <!-- Login formu için statik hata gösterimi (PHP olmadan) -->
            <div id="loginAlert" class="alert alert-danger mb-3" style="display:none;">

                <span id="loginAlertMsg"></span>
            </div>

            <!-- Form -->
            <form action="php/login.php" method="POST" id="loginForm" novalidate>

                <!-- E-posta -->
                <div class="mb-4">
                    <label for="loginEmail" class="form-label fw-semibold">
                        <i class="bi bi-envelope me-2 text-primary"></i>E-Posta (Öğrenci No)
                    </label>
                    <input type="email" class="form-control form-control-lg" id="loginEmail" name="email"
                        placeholder="b251210043@sakarya.edu.tr" autocomplete="email" required>
                    <div id="emailError" class="text-danger small mt-1" style="display:none;"></div>
                    <div class="form-text">Format: <code>b251210043@sakarya.edu.tr</code></div>
                </div>

                <!-- Şifre -->
                <div class="mb-4">

                    </label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-lg" id="loginPass" name="password"
                            placeholder="Öğrenci numaranız" autocomplete="current-password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePass"
                            title="Şifreyi göster/gizle">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                    <div id="passError" class="text-danger small mt-1" style="display:none;"></div>
                    <div class="form-text">Format: <code>B251210043</code></div>
                </div>

                <!-- Beni Hatırla -->
                <div class="mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe" name="remember">
                        <label class="form-check-label" for="rememberMe">Beni hatırla</label>
                    </div>
                </div>

                <!-- Giriş Yap Butonu -->
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold" onclick="return validateLogin()">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Şifre göster/gizle
        document.getElementById('togglePass').addEventListener('click', function () {
            const input = document.getElementById('loginPass');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });
    </script>
